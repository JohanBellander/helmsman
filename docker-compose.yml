services:
  helmsman:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COOLIFY_BASE_URL=${COOLIFY_BASE_URL}
      - COOLIFY_ACCESS_TOKEN=${COOLIFY_ACCESS_TOKEN}
      - BESZEL_URL=${BESZEL_URL}
      - BESZEL_EMAIL=${BESZEL_EMAIL}
      - BESZEL_PASSWORD=${BESZEL_PASSWORD}
      - BESZEL_WEBHOOK_SECRET=${BESZEL_WEBHOOK_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_SCAN_ENABLED=${LOG_SCAN_ENABLED:-true}
      - LOG_SCAN_INTERVAL_SEC=${LOG_SCAN_INTERVAL_SEC:-600}
      - LOG_SCAN_LINES=${LOG_SCAN_LINES:-200}
      - LOG_SCAN_COOLDOWN_SEC=${LOG_SCAN_COOLDOWN_SEC:-1800}
      - LOG_SCAN_EXCLUDE=${LOG_SCAN_EXCLUDE:-}
      - BACKEND=${BACKEND:-anthropic}
      - BACKEND_FALLBACK=${BACKEND_FALLBACK-anthropic}
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-}
      - LLAMACPP_API_KEY=${LLAMACPP_API_KEY:-}
      - LLAMACPP_MODEL=${LLAMACPP_MODEL:-}
      - LLAMACPP_TIMEOUT_SEC=${LLAMACPP_TIMEOUT_SEC:-60}
      - LLAMACPP_TEMPERATURE=${LLAMACPP_TEMPERATURE:-0.5}
    networks:
      coolify:
        aliases:
          - helmsman
    expose:
      - "8000"
    healthcheck:
      # curl is purged from the runtime image (see Dockerfile); use python's
      # stdlib instead. urlopen raises on 5xx, so a degraded /health (503)
      # correctly fails the probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  coolify:
    external: true
